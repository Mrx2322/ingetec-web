<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07172b" />
    <title>Sin conexión | INGETEC</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        color: #f5f8fc;
        background: radial-gradient(ellipse at top, #12345a 0, #07172b 55%, #050d18 100%);
        font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        width: min(100%, 430px);
        padding: 36px 28px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 24px;
        background: rgb(255 255 255 / 6%);
        box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
      }
      .mark {
        width: 58px;
        height: 58px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border: 1px solid rgb(255 204 0 / 45%);
        border-radius: 18px;
        color: #ffcc00;
        font-size: 27px;
      }
      h1 { margin: 0 0 10px; font-size: clamp(24px, 6vw, 30px); line-height: 1.2; }
      p { margin: 0; color: #c5d1df; }
      button {
        margin-top: 24px;
        padding: 13px 22px;
        border: 0;
        border-radius: 999px;
        color: #07172b;
        background: #ffcc00;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">⚡</div>
      <h1>Sin conexión a internet</h1>
      <p>Para ver INGETEC, vuelve a conectarte a internet e inténtalo de nuevo.</p>
      <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
